<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add task || Student Study Planner</title>
    <link rel="stylesheet" href="css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <!--header-->
    <header>

        <div class="logo">
            <h1>📚 Student Study Planner</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-task.html" class="active">Add Task</a></li>
                <li><a href="tasks.html">My Tasks</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
        
    </header>

    <!--Main-->

    <main>
        <section class="hero">

            <h2>Add a New Study Task</h2>

            <p>
                Fill in the details below to create a new assignment, project, exam reminder or study session.
            </p>

        </section>

        <!--Form-->

        <section>
            <form id="taskForm">
                <div class="form-group">
                    <label for="course">
                        Course Name
                    </label>

                    <input 
                        type="text"
                        id="course"
                        placeholder="e.g. Software Development"
                        required>
                </div>

                <div class="form-group">
                    <label for="title">
                        Task Title
                    </label>

                    <input 
                        type="text"
                        id="title"
                        placeholder="e.g. Javascript Project"
                        required>
                </div>

                <div class="form-group">
                    <label for="dueDate">
                        Due Date
                    </label>

                    <input 
                        type="date"
                        id="dueDate"
                        required>
                </div>

                <div class="form-group">
                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="">
                            Select Priority
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>

                </div>

                <div class="form-group">
                    <label for="description">
                        Description
                    </label>

                    <textarea 
                    id="description"
                    rows="5"
                    placeholder="Enter task description..."
                    required></textarea>

                </div>

                <div class="task-buttons">

                    <button type="submit">
                        Save Task
                    </button>

                    <button type="reset" class="delete">
                        Clear Form
                    </button>

                </div>

            </form>
        </section>
    </main>

    <!--footer-->

    <footer>
        <p>
            &copy;
            <span id="year"></span>

            Student Study Planner |
            Designed by Robin
        </p>
    </footer>

    <!--Javascript-->

    <script src="js/addTask.js"></script>

</body>
</html>
