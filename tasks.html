<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks | Student Study Planner</title>

    <link rel="stylesheet" href="css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
     <header>

        <div class="logo">
            <h1>📚 Student Study Planner</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-task.html" >Add Task</a></li>
                <li><a href="tasks.html" class="active">My Tasks</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
     </header>

     <!--Main-->

     <main>
        <!--page heading-->
        <section class="hero">

            <h2>My Study Tasks</h2>

            <p>
                View, search, update, complete and delete your study tasks.
            </p>
        </section>

        <!--Search and Filter-->

        <section class="dashboard">

            <h2>Search & Filter</h2>

            <div class="stats-container">

                <div class="form-group">

                    <label for="searchTask">
                        Search Task
                    </label>

                    <input 
                    type="text" 
                    id="searchTask"
                    placeholder="Search by title or course...">

                </div>

                <div class="form-group">
                    
                    <label for="filterPriority">
                        Filter by Priority
                    </label>

                    <select id="filterPriority>

                        <option value="All">All Priorities</option>

                        <option value="High">High</option>

                        <option value="Medium">Medium</option>

                        <option value="Low">Low</option>
                        
                    </select>

                </div>

            </div>

        </section>
        

     </main>

</body>
</html>
