<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
</head>
<body>
    <!--Header-->
    <header>

        <div class="logo">
            <h1>📚 Student Study Planner</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
            </ul>
        </nav>
    </header>

    <!--Main-->

    <main>
        <!--hero section-->
        <section class="hero">
            <h2>Plan smarter. Study better</h2>

            <p>
                Stay organized by managing your assignments, study sessions, deadlines and academic goals in one place.
            </p>

            <a href="add-task.html" class="btn">
                Add your first task
            </a>
        </section>

        <!--Dashboard statistics-->
        <section class="dashboard">
            <h2>Dashboard</h2>

            <div class="stats-container">

                <article class="card">
                    <h3>Total tasks</h3>
                    <p id="totalTasks">0</p>
                </article>

                <article class="card">
                    <h3>Pending tasks</h3>
                    <p id="pendingTasks">0</p>
                </article>

                <article class="card">
                    <h3>Completed tasks</h3>
                    <p id="completedTasks">0</p>
                </article>

            </div>
            
        </section>
    </main>

</body>
</html>
